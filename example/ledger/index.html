<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nito Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Dense-tool shell from nito-design references/erp.md: topbar 52, sidebar 240,
   sticky toolbar, table plus one inspector column. One accent, four semantic hues. */
:root{
  --ink:#1d1d1f; --ink-secondary:#57575c; --ink-muted:#6e6e73;
  --surface:#ffffff; --surface-alt:#f5f5f7; --hairline:#e3e3e7;
  --accent:#0066cc; --on-accent:#ffffff;
  --success:#116633; --warning:#92400e; --critical:#b91c1c; --neutral:#57575c;
  --row-h:40px;
  --radius-pill:980px; --radius-card:12px; --radius-tile:6px;
  --dur-hover:80ms; --dur-state:150ms; --ease:cubic-bezier(.4,0,.6,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f5f5f7; --ink-secondary:#c7c7cc; --ink-muted:#a1a1a6;
  --surface:#1c1c1e; --surface-alt:#2c2c2e; --hairline:#3a3a3c;
  --accent:#2997ff; --on-accent:#000000;
  --success:#4ade80; --warning:#fbbf24; --critical:#f87171; --neutral:#a1a1a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#f5f5f7; --ink-secondary:#c7c7cc; --ink-muted:#a1a1a6;
  --surface:#1c1c1e; --surface-alt:#2c2c2e; --hairline:#3a3a3c;
  --accent:#2997ff; --on-accent:#000000;
  --success:#4ade80; --warning:#fbbf24; --critical:#f87171; --neutral:#a1a1a6; color-scheme:dark}
[data-density="compact"]{--row-h:32px}
[data-density="comfortable"]{--row-h:48px}

*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.2857742857;letter-spacing:-0.016em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;letter-spacing:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:inherit}
h1,h2,h3,p{margin:0}
.meta{font-size:12px;line-height:1.3333733333;letter-spacing:-0.01em;color:var(--ink-muted)}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--hairline);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:600;white-space:nowrap}
.brand .meta{font-weight:400;margin-left:8px}
.top .grow{flex:1}
.top label{display:flex;align-items:center;gap:8px}
.top select{height:32px;padding:0 8px;border:1px solid var(--hairline);border-radius:var(--radius-tile);background:var(--surface)}

.side{background:var(--surface-alt);border-right:1px solid var(--hairline);padding-block:16px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.side h2{font-size:12px;line-height:1.3333733333;letter-spacing:-0.01em;font-weight:600;color:var(--ink-muted);padding:16px 8px 4px}
.side h2:first-child{padding-top:0}
.side ul{list-style:none;margin:0;padding:0}
.side a{display:block;height:32px;line-height:32px;padding:0 8px;border-radius:var(--radius-tile);color:var(--ink-secondary);white-space:nowrap}
.side a:hover{text-decoration:none;background:var(--hairline);transition:background var(--dur-hover) var(--ease)}
.side a[aria-current="page"]{color:var(--accent);font-weight:600;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}

main{min-width:0}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--hairline);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:16px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.toolbar>div:first-child{flex:1;min-width:0}
h1{font-size:28px;line-height:1.142854;font-weight:600}
.toolbar .meta{margin-top:4px}
.content{padding-block:24px 32px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}

.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.stmt .tw{max-height:none}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.side-col{position:sticky;top:104px}
h2{font-size:20px;line-height:1.2;font-weight:600}
h3{font-size:14px;font-weight:600}
.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface-alt);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi b{font-size:20px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tw{overflow:auto;max-height:70vh;border:1px solid var(--hairline);border-radius:var(--radius-card)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{height:var(--row-h);padding:0 12px;text-align:left;white-space:nowrap;vertical-align:middle}
thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;border-bottom:1px solid var(--hairline)}
/* the identifying column stays put when a wide table scrolls sideways */
thead th:first-child{left:0;z-index:3}
tbody td:first-child,tfoot td:first-child{position:sticky;left:0;z-index:1}
tbody tr+tr td{border-top:1px solid var(--hairline)}
tbody td{background:var(--surface)}
tfoot td{font-weight:600;border-top:1px solid var(--hairline);background:var(--surface)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.trunc{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.id{font-weight:600}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface-alt);transition:background var(--dur-hover) var(--ease)}
tr[aria-selected="true"] td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.neg{color:var(--critical)}
.empty{padding:24px;color:var(--ink-secondary);border:1px dashed var(--hairline);border-radius:var(--radius-card)}

.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-pill);
  font-size:12px;line-height:1;letter-spacing:-0.01em;font-weight:600;
  background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.badge[data-status="success"]{--c:var(--success)}
.badge[data-status="warning"]{--c:var(--warning)}
.badge[data-status="critical"]{--c:var(--critical)}
.badge[data-status="neutral"]{--c:var(--neutral)}

.panel{background:var(--surface-alt);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
form{display:flex;flex-direction:column;gap:16px;min-width:0}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.fld label{font-weight:600}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
input:not([type=checkbox]),select{height:var(--row-h);padding:0 12px;width:100%;min-width:0;
  border:1px solid var(--hairline);border-radius:var(--radius-tile);background:var(--surface)}
input[inputmode=decimal]{text-align:right;font-variant-numeric:tabular-nums}
input[aria-invalid="true"]{border-color:var(--critical)}
/* the box is drawn at 20px; the real input sits over it at 28px, the dense-tool minimum target */
.check{position:relative;display:flex;align-items:center;gap:8px;min-height:28px;cursor:pointer}
.check input{position:absolute;left:-4px;top:0;width:28px;height:28px;margin:0;opacity:0;cursor:pointer}
.check .box{width:20px;height:20px;flex:none;display:grid;place-items:center;
  border:1px solid var(--ink-muted);border-radius:var(--radius-tile);background:var(--surface)}
.check input:checked+.box{background:var(--accent);border-color:var(--accent)}
.check input:checked+.box::after{content:"";width:6px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.check input:disabled+.box{opacity:.4}
.check:has(input:disabled){cursor:not-allowed;color:var(--ink-muted)}
.block-head a{display:inline-flex;align-items:center;min-height:28px}
.help{font-size:12px;line-height:1.3333733333;letter-spacing:-0.01em;color:var(--ink-muted)}
.help.err{color:var(--critical)}
.actions{display:flex;flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar select,.toolbar input{width:auto}
.btn{height:var(--row-h);padding:0 16px;border:0;border-radius:var(--radius-pill);background:var(--accent);color:var(--on-accent);
  font-weight:600;cursor:pointer;transition:filter var(--dur-state) var(--ease)}
.btn:hover{filter:brightness(1.08)}
.btn--ghost{background:var(--surface);color:var(--accent);border:1px solid var(--hairline)}
.btn--danger{background:var(--critical);color:var(--surface)}
.btn--sm{height:28px;padding:0 12px}
.note{border-radius:var(--radius-tile);padding:12px;background:color-mix(in srgb,var(--c) 12%,var(--surface));display:flex;flex-direction:column;gap:4px}
.note ul{margin:0;padding-left:16px}
.note--ok{--c:var(--success)} .note--bad{--c:var(--critical)}
.note strong{color:var(--c)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0}
dt{color:var(--ink-muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd.num{text-align:left}
.lines td{height:32px}
/* fixed layout: the account name gives way, the amount never does */
.lines table{table-layout:fixed}
.lines th:nth-child(2){width:24px}
.lines th:nth-child(3){width:128px}
.lines .acct,.lines tfoot td:first-child{overflow:hidden;text-overflow:ellipsis}
.lines tr.cr td:first-child{padding-left:24px}
.lines td:nth-child(2){color:var(--ink-muted);padding-inline:4px}
.stmt td:first-child{padding-left:24px}
.stmt tr.grp td{font-weight:600;padding-left:12px;color:var(--ink-secondary)}
.stmt tr.tot td{font-weight:600}
.statements{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}

@media (max-width:1068px){
  .split,.statements{grid-template-columns:minmax(0,1fr)}
  .side-col{position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .top{flex-wrap:wrap;padding-block:8px}
  .side{border-right:0;border-bottom:1px solid var(--hairline);overflow-x:auto;padding-block:8px;
    padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .side h2{display:none}
  .side nav{display:flex;gap:4px}
  .side ul{display:flex;gap:4px}
  .toolbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .toolbar{flex-direction:column;align-items:stretch;gap:12px}
  h1{font-size:20px;line-height:1.2}
  .row2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <p class="brand">Nito Ledger<span class="meta" id="company"></span></p>
    <span class="badge" data-status="warning">Data contoh</span>
    <span class="grow"></span>
    <label class="meta" for="user">Pengguna
      <select id="user"><option value="rina">Rina, pembuat</option><option value="budi">Budi, penyetuju</option></select></label>
    <label class="meta" for="density">Kerapatan
      <select id="density"><option value="compact">Rapat</option><option value="">Normal</option><option value="comfortable">Longgar</option></select></label>
  </header>
  <aside class="side"><nav id="nav" aria-label="Menu"></nav></aside>
  <main id="main"><div class="content"><p class="meta">Memuat bagan akun…</p></div></main>
</div>

<script type="module">
// Every posting below goes through the posting core shipped in the
// nito-accounting skill, unchanged. This page only adds the documents, the
// screens and the in-browser "database" (state + localStorage).
import * as core from "../../skills/nito-accounting/assets/posting-core.mjs";
const COA_URL = "../../skills/nito-accounting/assets/coa-template-id.json";
const STORE = "nito-ledger-v1";
document.documentElement.lang = "id";

// ---------------------------------------------------------------- config
const USERS = { rina: "Rina", budi: "Budi" };
// Journals for documents. Each cash or bank account is a journal of its own
// (state.cashbanks), so receipts and payments are numbered per account.
const JOURNALS = { PJ: "Penjualan", PB: "Pembelian", JU: "Umum" };
const KINDS = {
  sale:             { label: "Penjualan barang", journal: "PJ", prefix: "INV" },
  service:          { label: "Penjualan jasa", journal: "PJ", prefix: "INV" },
  receipt:          { label: "Penerimaan", journal: "cash", prefix: "RCV" },
  purchase:         { label: "Pembelian barang", journal: "PB", prefix: "BILL" },
  purchase_service: { label: "Pembelian jasa", journal: "PB", prefix: "BILL" },
  asset:            { label: "Pembelian aset tetap", journal: "PB", prefix: "BILL" },
  payment:          { label: "Pembayaran", journal: "cash", prefix: "PAY" },
  transfer:         { label: "Transfer kas/bank", journal: "cash", prefix: "TRF" },
  cash_in:          { label: "Kas masuk lain", journal: "cash", prefix: "BKM" },
  cash_out:         { label: "Kas keluar lain", journal: "cash", prefix: "BKK" },
  ppn_settlement:   { label: "Kompensasi PPN", journal: "JU", prefix: "PPN" },
  tax_payment:      { label: "Setoran pajak", journal: "cash", prefix: "SSP" },
  depreciation:     { label: "Penyusutan", journal: "JU", prefix: "DEP" },
};
const METHODS = { transfer: "Transfer bank", cash: "Tunai", giro: "Cek / giro" };
const AR_KINDS = ["sale", "service"], AP_KINDS = ["purchase", "purchase_service", "asset"];
// The company adapts the skill's template: accounts the template does not carry.
const EXTRA_ACCOUNTS = [
  { code: "1-1210", name: "Bank Mandiri", type: "asset", normal_balance: "debit" },
  { code: "6-3000", name: "Beban Administrasi Bank", type: "expense", normal_balance: "debit" },
  { code: "7-1000", name: "Pendapatan Bunga Bank", type: "temporary", normal_balance: "credit" },
  { code: "1-1750", name: "PPN Lebih Bayar", type: "asset", normal_balance: "debit" },
  { code: "2-1150", name: "Barang Diterima Belum Ditagih (GR/IR)", type: "liability", normal_balance: "credit" },
  { code: "2-1410", name: "Utang PPN", type: "liability", normal_balance: "credit" },
  { code: "6-1000", name: "Beban Jasa Profesional", type: "expense", normal_balance: "debit" },
  { code: "6-2000", name: "Beban Penyusutan", type: "expense", normal_balance: "debit" },
];
// Account determination: role key -> account. The engine never reads a code.
const ROLES = {
  bank: ["Kas/bank bawaan", "1-1200"], bank_charges: ["Biaya bank", "6-3000"],
  receivable: ["Piutang usaha", "1-1300"], payable: ["Utang usaha", "2-1100"],
  sales: ["Penjualan barang", "4-1000"], service_revenue: ["Pendapatan jasa", "4-2000"],
  tax_output_ppn: ["PPN Keluaran", "2-1400"], tax_input_ppn: ["PPN Masukan", "1-1700"],
  ppn_payable: ["Utang PPN", "2-1410"], ppn_receivable: ["PPN Lebih Bayar", "1-1750"],
  prepaid_tax_22_23_25: ["PPh dibayar di muka", "1-1800"], wht_payable_23: ["Utang PPh 23", "2-1510"],
  cogs: ["HPP", "5-0000"], inventory: ["Persediaan", "1-1500"], stock_received_not_billed: ["GR/IR", "2-1150"],
  service_expense: ["Beban jasa", "6-1000"], fixed_asset: ["Aset tetap", "1-2100"],
  accumulated_depreciation: ["Akumulasi penyusutan", "1-2190"], depreciation_expense: ["Beban penyusutan", "6-2000"],
};
// Effective-dated tax parameters (nito-accounting references/values-to-verify.md).
const TAX = [
  { code: "PPN", from: "2025-01-01", num: "132", den: "1200", label: "12% x DPP nilai lain 11/12 (efektif 11%)",
    source: "UU 7/2021 Pasal 7; PMK 131/2024", status: "Terverifikasi s.d. pertengahan 2026, cek ulang" },
  { code: "PPh 23", from: "2009-01-01", num: "2", den: "100", label: "2% atas jasa, dari DPP",
    source: "UU 36/2008 Pasal 23", status: "Teks 2008; dasar tanpa PPN belum terverifikasi" },
];
const TYPES = ["asset", "contra_asset", "liability", "equity", "contra_equity", "revenue", "contra_revenue", "expense", "temporary", "suspense"];
const TYPE_ID = { asset: "Aset", contra_asset: "Kontra aset", liability: "Liabilitas", equity: "Ekuitas", contra_equity: "Kontra ekuitas",
  revenue: "Pendapatan", contra_revenue: "Kontra pendapatan", expense: "Beban", temporary: "Sementara", suspense: "Penampung" };

// ---------------------------------------------------------------- helpers
let state, coa;
const ui = { sel: null, flash: null, f: { asOf: "2026-12-31", from: "2026-01-01", to: "2026-12-31", account: "1-1200", jstatus: "", journal: "" } };
const M = (s) => core.toMinor(s), S = (m) => core.fromMinor(m);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => globalThis.crypto?.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now().toString(36);
const txt = (m) => { const neg = m < 0n, [i, f] = S(neg ? -m : m).split("."); const t = BigInt(i).toLocaleString("id-ID") + "," + f; return neg ? `(${t})` : t; };
const fmt = (m) => (m < 0n ? `<span class="neg">${txt(m)}</span>` : txt(m));
const MON = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const dfmt = (iso) => { const [y, m, d] = iso.split("-"); return `${d} ${MON[+m - 1]} ${y}`; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const lastDay = (ym) => { const [y, m] = ym.split("-").map(Number); return `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`; };
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const defDate = () => { const t = today(); return t.startsWith(String(state.company.fiscal_year)) ? t : `${state.company.fiscal_year}-12-31`; };
const role = (r) => state.defaults[r];
const acct = (code) => state.accounts[code];
const aname = (code) => (acct(code) ? `${code} ${acct(code).name}` : code);
const party = (id) => [...state.customers, ...state.suppliers].find((p) => p.id === id)?.name ?? "";
const cbOf = (id) => state.cashbanks.find((c) => c.id === id);
const jname = (code) => JOURNALS[code] ?? cbOf(code)?.name ?? code;
const cbBal = (c, to) => bal(c.account, to);
class FieldErr extends Error { constructor(field, msg) { super(msg); this.field = field; } }

function money(raw, field, { zero = false } = {}) {
  const s = String(raw ?? "").replace(/\s/g, "").replace(/\./g, "").replace(",", ".");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) throw new FieldErr(field, "Isi nominal, contoh 95.000.000 atau 1.250,50");
  const v = S(M(s));
  if (!zero && M(v) === 0n) throw new FieldErr(field, "Nominal harus lebih dari nol");
  return v;
}
function dateField(v, field = "date") {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v ?? "")) throw new FieldErr(field, "Pilih tanggal");
  return v;
}
function taxAmt(code, base, date) {
  const p = state.tax.filter((t) => t.code === code && t.from <= date).sort((a, b) => b.from.localeCompare(a.from))[0];
  if (!p) throw new Error(`Tidak ada tarif ${code} yang berlaku pada ${dfmt(date)}`);
  return core.percentOf(base, BigInt(p.num), BigInt(p.den));
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} }

// ---------------------------------------------------------------- the "database"
function fresh() {
  const accounts = {};
  for (const a of [...coa.accounts, ...EXTRA_ACCOUNTS])
    accounts[a.code] = { code: a.code, name: a.name, type: a.type, normal_balance: a.normal_balance,
      control: a.control ?? null, closing_only: !!a.zero_outside_closing, active: true, postable: true };
  accounts["1-1200"].name = "Bank BCA";
  const periods = {};
  for (let m = 1; m <= 12; m++) periods[`2026-${String(m).padStart(2, "0")}`] = "open";
  return { v: 2, company: { name: "PT Contoh Niaga Nusantara", pkp: true, fiscal_year: 2026, term_days: 30 },

// One database transaction: every change inside fn is undone if it fails,

const live = () => state.entries.filter((e) => e.status !== "draft");

function bal(code, to, from) {
  let m = 0n;

  for (const e of live()) {
    if ((to && e.posting_date > to) || (from && e.posting_date < from)) continue;
    for (const l of e.lines) if (l.account === code) m += M(l.debit) - M(l.credit);

const debitNormal = (a) => a.normal_balance === "debit" || (a.normal_balance === "either" && ["asset", "expense", "suspense"].includes(a.type));

    const m = bal(a.code, to, from);
    if (m === 0n || a.closing_only) continue;
    if (a.type === "revenue" || a.type === "contra_revenue") g.rev.push([a, -m]);
    else if (a.code === role("cogs")) g.cogs.push([a, m]);
    else if (a.type === "expense") g.opex.push([a, m]);
    else if (a.type === "temporary") g.other.push([a, -m]);

    const deps = state.docs.filter((x) => x.status === "open" && x.ref === d.no);

const VIEWS = {

// ---------------------------------------------------------------- render and events
let lineTpl = null;
const viewId = () => (VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "dasbor");
function render() {
  const id = viewId(), [, title, fn] = VIEWS[id];
  const groups = {};
  for (const [k, [g, t]] of Object.entries(VIEWS)) (groups[g] ??= []).push(`<li><a href="#${k}"${k === id ? ' aria-current="page"' : ""}>${t}</a></li>`);
  document.getElementById("nav").innerHTML = Object.entries(groups).map(([g, items]) => `<h2>${g}</h2><ul>${items.join("")}</ul>`).join("");
  document.getElementById("company").textContent = state.company.name;
  document.getElementById("user").value = state.user;
  const v = fn();
  lineTpl = v.lineTpl ?? null;
  document.getElementById("main").innerHTML = `<header class="toolbar"><div><h1>${title}</h1><p class="meta">${v.sub ?? ""}</p></div>${v.actions ?? ""}</header><div class="content">${v.body}</div>`;
  document.querySelectorAll('form[data-form="receipt"],form[data-form="payment"]').forEach(suggest);
  if (ui.focus) { const el = document.getElementById(ui.focus); ui.focus = null; el?.scrollIntoView({ block: "center" }); el?.focus(); }
}
function suggest(form) {
  const f = Object.fromEntries(new FormData(form)), d = state.docs.find((x) => x.no === f.ref);
  if (!d) return;
  const svc = form.dataset.form === "receipt" ? "service" : "purchase_service", cb = form.elements.pph23;
  cb.disabled = d.kind !== svc;
  if (cb.disabled) cb.checked = false;
  const rem = openAmt(d), r = form.dataset.form === "receipt";
  let w = 0n, fee = 0n;
  try { if (cb.checked) w = M(taxAmt("PPh 23", d.dpp, f.date || d.date)); } catch {}
  try { fee = f.charges ? M(money(f.charges)) : 0n; } catch {}
  // settle the whole remainder by default; the user can lower it for a part payment
  const through = r ? rem - w - fee : rem - w + fee;
  form.elements.bank.value = txt(through);
  const h = form.querySelector('[data-help="bank"]');
  const parts = [`Sisa ${txt(rem)}`];
  if (w) parts.push(`PPh 23 ${txt(w)} jadi ${r ? "pajak dibayar di muka" : "utang PPh 23"}`);
  if (fee) parts.push(`biaya bank ${txt(fee)} jadi beban`);
  h.textContent = h.dataset.orig = parts.join(", ") + ". Kurangi untuk bayar sebagian.";
}
function showErrors(form, r) {
  if (r.field) {
    const h = form.querySelector(`[data-help="${r.field}"]`);
    const el = form.elements[r.field];
    if (h) { h.textContent = r.errors[0]; h.classList.add("err"); }
    if (el?.setAttribute) { el.setAttribute("aria-invalid", "true"); el.focus(); }
    if (h) return;
  }
  form.querySelector("[data-status]").innerHTML = `<div class="note note--bad" role="alert"><strong>Ditolak</strong><ul>${(r.errors ?? []).map((e) => {
    const t = idErr(e);
    return `<li>${esc(t)}${t !== e ? `<br><span class="meta">posting core: ${esc(e)}</span>` : ""}</li>`;
  }).join("")}</ul></div>`;
}
// The core speaks English; the screen speaks Indonesian and shows both.
const ERR = [
  [/^entry does not balance: debit (.+), credit (.+)$/, "Jurnal tidak seimbang: debit $1, kredit $2"],
  [/^period is closed for (.+)$/, "Periode tertutup untuk tanggal $1"],
  [/^approver must differ from maker$/, "Penyetuju harus pengguna lain, bukan pembuat jurnal"],
  [/^line (\d+): account (.+) is inactive$/, "Baris $1: akun $2 nonaktif"],
  [/^line (\d+): account (.+) is a group account$/, "Baris $1: akun $2 adalah akun induk"],
  [/^line (\d+): (.+) is a control account and takes no manual posting$/, "Baris $1: $2 akun kontrol, hanya diisi dari dokumen modul"],
  [/^line (\d+): exactly one of debit and credit must be above zero$/, "Baris $1: isi debit atau kredit, salah satu saja"],
  [/^line (\d+): unknown account (.+)$/, "Baris $1: akun $2 tidak dikenal"],
  [/^an entry needs at least two lines$/, "Jurnal butuh minimal dua baris"],
  [/^no account configured for role "(.+)"$/, "Belum ada akun untuk peran $1. Atur di Konfigurasi."],
];
const idErr = (e) => { for (const [re, t] of ERR) if (re.test(e)) return e.replace(re, t); return e; };
function clearHelp(form) {
  form.querySelectorAll(".help.err").forEach((h) => { h.textContent = h.dataset.orig; h.classList.remove("err"); });
  form.querySelectorAll('[aria-invalid="true"]').forEach((el) => el.removeAttribute("aria-invalid"));
  form.querySelector("[data-status]")?.replaceChildren();
}
document.addEventListener("submit", (ev) => {
  const form = ev.target.closest("form[data-form]");
  if (!form) return;
  ev.preventDefault();
  if (form.dataset.confirm && !form.dataset.armed) {
    form.dataset.armed = "1";
    const b = form.querySelector("[type=submit]");
    b.textContent = form.dataset.confirm; b.classList.add("btn--danger");
    return;
  }
  clearHelp(form);
  const f = Object.fromEntries(new FormData(form));
  let r;
  try { r = H[form.dataset.form](f); } catch (e) { r = { ok: false, errors: [e.message], field: e.field }; }
  if (!r.ok) { showErrors(form, r); return; }
  if (r.flash) ui.flash = r.flash;
  if (r.sel !== undefined) ui.sel = r.sel;
  render();
});
document.addEventListener("change", (ev) => {
  const form = ev.target.closest("form[data-form]");

  else if ((form.dataset.form === "receipt" || form.dataset.form === "payment") && ["ref", "pph23", "charges", "date"].includes(ev.target.name)) suggest(form);

function act(el) {
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "entry" || a === "doc") { ui.sel = { type: a, id }; render(); }
  else if (a === "cb") { ui.f.cbsel = id; render(); }

    ui.flash = `Akun ${id} ${state.accounts[id].active ? "diaktifkan" : "dinonaktifkan. Posting ke akun ini akan ditolak"}.`;
    render();
  }
}
